org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.workers.max=2
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=15000
systemProp.org.gradle.internal.repository.retry.backoff=30000
# NOTE: org.gradle.java.home and org.gradle.java.installations.paths are
# machine-specific and must NOT be committed. The previous value pointed at a
# WSL path (/mnt/devdrive/...), which made every non-WSL checkout fail Gradle
# startup with an unusable Java home. Point Gradle at a JDK with the JAVA_HOME
# environment variable instead; auto-detect is re-enabled so it can also find
# the Android Studio bundled JBR.
systemProp.org.gradle.java.installations.auto-detect=true
