<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    `$FLUTTER_BASE_HREF` is replaced by `flutter build web --base-href`; it must
    start and end with "/" when serving from a sub-path.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SOLVANTA — school management, assessment and student safety for Ghanaian schools.">
  <meta name="theme-color" content="#1B3B6F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SOLVANTA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SOLVANTA</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading screen shown while the engine and app code download (several MB on
    a first visit). Same navy ramp and gold hairline as the sign-in screen, so
    the hand-off to Flutter doesn't flash white.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #1B3B6F; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1B3B6F, #2E5C9A);
      color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .mark { font-size: 30px; font-weight: 800; letter-spacing: 6px; }
    #splash .rule { width: 54px; height: 3px; margin: 10px 0 22px; border-radius: 3px; background: #E3A008; }
    #splash .spin {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
      animation: spin .9s linear infinite;
    }
    #splash .hint { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.75); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spin { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="mark">SOLVANTA</div>
    <div class="rule"></div>
    <div class="spin" aria-hidden="true"></div>
    <div class="hint">Loading your school…</div>
  </div>
  <noscript>
    <p style="color:#fff;text-align:center;font-family:sans-serif;padding:24px">
      SOLVANTA needs JavaScript enabled to run in the browser.
    </p>
  </noscript>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('done');
          setTimeout(function () { splash.remove(); }, 350);
        }
      },
    });
  </script>
</body>
</html>
