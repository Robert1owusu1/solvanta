# Keeps dependencies patched automatically — one supply-chain safety net
# alongside the govulncheck step in ci.yml. Dependabot opens weekly PRs, which
# the ci workflow then checks like any other.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
