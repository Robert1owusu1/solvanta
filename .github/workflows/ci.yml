name: ci

# Runs on every push (any branch) and every pull request, so feature branches
# are checked before they reach main, not only after.
on:
  push:
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (go vet + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: solvanta
          POSTGRES_PASSWORD: test
          POSTGRES_DB: solvanta
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U solvanta -d solvanta"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt (no diffs)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go build
        run: go build ./...
      # -p 1: the store and API packages share this database and the store
      # tests truncate every table, so the packages must not run at once. The
      # DSN also exercises the migrations on real PostgreSQL.
      - name: go test (with PostgreSQL + coverage)
        run: go test -count=1 -p 1 -coverprofile=coverage.out ./...
        env:
          TEST_POSTGRES_DSN: postgres://solvanta:test@127.0.0.1:5433/solvanta?sslmode=disable
      - name: go coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: warn
      # Supply-chain vulnerability scan. Non-blocking for now (findings are
      # often in the Go toolchain and clear with the next patch release); it
      # surfaces advisories in the log without failing the build. Tighten to a
      # gate once the dependency set is consistently clean.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  client:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The parity suite runs only against a live API; it self-skips otherwise.
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: client-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  # CD: build the production web bundle on main once both check jobs pass, and
  # keep it as a downloadable artifact ready to deploy (see docs/DEPLOYMENT.md).
  build-web:
    name: Build web bundle (main)
    needs: [backend, client]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: solvanta-web
          path: build/web
          if-no-files-found: error
