name: ci

# Runs on every push/PR to the default branch once a remote repository exists.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (go vet + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: solvanta
          POSTGRES_PASSWORD: test
          POSTGRES_DB: solvanta
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U solvanta -d solvanta"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      # -p 1: the store and API packages share this database and the store
      # tests truncate every table, so the packages must not run at once.
      - run: go test -p 1 ./...
        env:
          TEST_POSTGRES_DSN: postgres://solvanta:test@127.0.0.1:5433/solvanta?sslmode=disable

  client:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.x"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The parity suite runs only against a live API; it self-skips otherwise.
      - run: flutter test